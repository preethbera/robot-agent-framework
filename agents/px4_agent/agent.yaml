schema_version: '0.1.0'
agent:
  id: px4_agent
  description: PX4 local NED state, commands, and explicit Offboard position control
expose:
  - {use: px4.landed, as: landed}
  - {use: px4.position, as: position}
  - {use: px4.velocity, as: velocity}
  - {use: px4.armed, as: armed}
  - {use: px4.flight_mode, as: flight_mode}
  - {use: px4.arm, as: arm}
  - {use: px4.disarm, as: disarm}
  - {use: px4.land, as: land}
  - {use: px4.hold, as: hold}
  - {use: px4.orbit, as: orbit}
  - {use: px4.offboard.position, as: offboard}
