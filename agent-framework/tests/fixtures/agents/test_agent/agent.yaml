schema_version: "0.1.0"
agent:
  id: test_agent
  description: Agent using the independent test binding
expose:
  - use: test.temperature
    as: temperature
  - use: test.command
    as: command
  - use: test.stream
    as: lidar_stream
    config:
      max_rate_hz: 5.0
      liveness_owner: application
groups:
  - id: sensors
    members: [temperature, lidar_stream]
constraints:
  - id: command_limit
    target: command
    kind: range
    parameters:
      max: 80.0
ros2:
  overrides: {}
